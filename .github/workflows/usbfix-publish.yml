name: USB FIX - Build and publish downloads

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "server/version.txt"
      - ".github/workflows/usbfix-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usbfix-download-publish-v2
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Baixar cÃ³digo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependÃªncias do aplicativo e ferramentas de build
        working-directory: client
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Baixar frpc para Windows
        working-directory: client
        run: python download_frp.py

      - name: Compilar aplicativo e instalador
        working-directory: client
        shell: cmd
        timeout-minutes: 30
        run: build_tudo.bat

      - name: Validar arquivos gerados
        shell: pwsh
        run: |
          $required = @(
            "client/dist/USB-Fix.exe",
            "client/dist/Instalar USB FIX.exe"
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Arquivo de build ausente: $file" }
          }

      # Esta VPS tambem hospeda o site servicetool.
      # Este job mexe SOMENTE em /opt/tunnel/server/... (USB FIX).
      # Sem artifact: os .exe vao direto daqui para a VPS via SCP.

      - name: Validar credenciais exclusivas do USB FIX
        shell: pwsh
        env:
          VPS_HOST: ${{ secrets.USBFIX_HOST }}
          VPS_USER: ${{ secrets.USBFIX_USER }}
          VPS_PORT: ${{ secrets.USBFIX_PORT }}
          VPS_KEY: ${{ secrets.USBFIX_SSH_KEY }}
        run: |
          foreach ($pair in @(
            @{ Name = "VPS_HOST"; Secret = "USBFIX_HOST" },
            @{ Name = "VPS_USER"; Secret = "USBFIX_USER" },
            @{ Name = "VPS_PORT"; Secret = "USBFIX_PORT" },
            @{ Name = "VPS_KEY";  Secret = "USBFIX_SSH_KEY" }
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($pair.Name))) {
              throw "Configure o secret $($pair.Secret)"
            }
          }

      - name: Enviar somente os downloads do USB FIX
        shell: pwsh
        env:
          VPS_HOST: ${{ secrets.USBFIX_HOST }}
          VPS_USER: ${{ secrets.USBFIX_USER }}
          VPS_PORT: ${{ secrets.USBFIX_PORT }}
          VPS_KEY: ${{ secrets.USBFIX_SSH_KEY }}
          RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = "Stop"

          $keyPath = Join-Path $env:RUNNER_TEMP "usbfix_id_rsa"
          [System.IO.File]::WriteAllText($keyPath, $env:VPS_KEY.Trim() + "`n")
          & icacls $keyPath /inheritance:r /grant:r "$($env:USERNAME):F" | Out-Null

          # O OpenSSH do runner Windows nao negocia sntrup761x25519-sha512,
          # oferecido pelo Ubuntu da VPS. Forca curve25519-sha256, aceito pelos dois.
          $knownHosts = Join-Path $env:USERPROFILE ".ssh\known_hosts"
          New-Item -ItemType Directory -Force -Path (Split-Path $knownHosts) | Out-Null
          $knownHostsOpt = ($knownHosts -replace '\\', '/')

          $sshOpts = @(
            "-o", "KexAlgorithms=curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group14-sha256",
            "-o", "StrictHostKeyChecking=accept-new",
            "-o", "UserKnownHostsFile=$knownHostsOpt",
            "-o", "BatchMode=yes"
          )

          function Invoke-Remote([string]$Command) {
            $output = & ssh -i $keyPath -p $env:VPS_PORT @sshOpts "${env:VPS_USER}@${env:VPS_HOST}" $Command
            $code = $LASTEXITCODE
            if ($code -ne 0) { throw "SSH falhou ($code): $Command" }
            return ($output -join "`n")
          }

          $remoteDir = "/opt/tunnel/server/site/downloads"
          $versionFile = "/opt/tunnel/server/version.txt"
          Invoke-Remote "test -d '$remoteDir' && test -w '$remoteDir' && test -f '$versionFile' && test -w '$versionFile'"

          $appTmp = "$remoteDir/USB-Fix.exe.upload-$env:RUN_ID"
          $installerTmp = "$remoteDir/Instalar-USB-FIX.exe.upload-$env:RUN_ID"
          $versionTmp = "$remoteDir/version.txt.upload-$env:RUN_ID"

          & scp -i $keyPath -P $env:VPS_PORT @sshOpts "client/dist/USB-Fix.exe" "${env:VPS_USER}@${env:VPS_HOST}:$appTmp"
          if ($LASTEXITCODE -ne 0) { throw "Falha no scp do USB-Fix.exe" }
          & scp -i $keyPath -P $env:VPS_PORT @sshOpts "client/dist/Instalar USB FIX.exe" "${env:VPS_USER}@${env:VPS_HOST}:$installerTmp"
          if ($LASTEXITCODE -ne 0) { throw "Falha no scp do instalador" }
          & scp -i $keyPath -P $env:VPS_PORT @sshOpts "server/version.txt" "${env:VPS_USER}@${env:VPS_HOST}:$versionTmp"
          if ($LASTEXITCODE -ne 0) { throw "Falha no scp de version.txt" }

          Invoke-Remote "mv -f -- '$appTmp' '$remoteDir/USB-Fix.exe' && mv -f -- '$installerTmp' '$remoteDir/Instalar USB FIX.exe' && cat '$versionTmp' > '$versionFile' && rm -f -- '$versionTmp'"

          $localApp = (Get-FileHash -Algorithm SHA256 "client/dist/USB-Fix.exe").Hash.ToLowerInvariant()
          $remoteApp = Invoke-Remote "sha256sum '$remoteDir/USB-Fix.exe' | cut -d' ' -f1"
          if ($localApp -ne $remoteApp.Trim().ToLowerInvariant()) { throw "SHA-256 divergente: USB-Fix.exe" }

          $localInstaller = (Get-FileHash -Algorithm SHA256 "client/dist/Instalar USB FIX.exe").Hash.ToLowerInvariant()
          $remoteInstaller = Invoke-Remote "sha256sum '$remoteDir/Instalar USB FIX.exe' | cut -d' ' -f1"
          if ($localInstaller -ne $remoteInstaller.Trim().ToLowerInvariant()) { throw "SHA-256 divergente: instalador" }

          $expectedVersion = (Get-Content -Raw "server/version.txt").Trim()
          $remoteVersion = Invoke-Remote "cat $versionFile"
          if ($remoteVersion.Trim() -ne $expectedVersion) {
            throw "Versao divergente: '$($remoteVersion.Trim())' != '$expectedVersion'"
          }

          Write-Host "USB-Fix.exe: SHA-256 confirmado"
          Write-Host "Instalar USB FIX.exe: SHA-256 confirmado"
          Write-Host "server/version.txt: $expectedVersion confirmado"
          Write-Host "Publicacao concluida (somente /opt/tunnel - servicetool intacto)."
