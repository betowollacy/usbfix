# Servidor do túnel (frps) — config do frp
bindAddr = "0.0.0.0"
bindPort = 7000

auth.method = "token"
auth.token = "" # A autorização real é validada pelo plugin local

transport.tls.force = true

# Aponte *.seu-dominio.com para este servidor (clientes usam nome.dominio:porta)
# subdomainHost = "usbfix.site"

# Portas públicas que os proxies podem usar — combine com TUNNEL_PORT_MIN/MAX
allowPorts = [
    {start = 40000, end = 49999}
]

# Autorização individual de clientes e isolamento por porta.
# O plugin só aceita tokens ativos e a porta atribuída à própria conta.
[[httpPlugins]]
name = "usbfix-user-auth"
addr = "127.0.0.1:9000"
path = "/handler"
ops = ["Login", "NewProxy"]
